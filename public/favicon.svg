<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5833c7" />
      <stop offset="60%" stopColor="#8767f9" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#fbbf24" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5833c7" flood-opacity="0.3" />
    </filter>
  </defs>

  {/* Fondo redondeado moderno estilo app */}
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#0e101d" stroke="#5833c7" stroke-width="2.5" />

  {/* Cubo / Sala isométrica estilizada */}
  {/* Piso */}
  <polygon points="50,68 22,54 50,40 78,54" fill="rgba(88, 51, 199, 0.25)" stroke="#8767f9" stroke-width="1.8" />
  
  {/* Pared Izquierda */}
  <polygon points="22,54 22,30 50,16 50,40" fill="rgba(88, 51, 199, 0.45)" stroke="#8767f9" stroke-width="1.8" />
  
  {/* Pared Derecha */}
  <polygon points="50,40 50,16 78,30 78,54" fill="rgba(135, 103, 249, 0.3)" stroke="#8767f9" stroke-width="1.8" />

  {/* Pilares */}
  <line x1="22" y1="30" x2="22" y2="54" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="16" x2="50" y2="40" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
  <line x1="78" y1="30" x2="78" y2="54" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />

  {/* Ondas Sonoras concéntricas de propagación */}
  <path d="M 40,55 A 12,6 0 0,0 60,55" fill="none" stroke="url(#pGrad)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 34,58 A 18,9 0 0,0 66,58" fill="none" stroke="url(#pGrad)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3,2" />
  <path d="M 28,61 A 24,12 0 0,0 72,61" fill="none" stroke="url(#pGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  {/* Fuente sonora puntual (S) */}
  <circle cx="50" cy="53" r="4.5" fill="url(#pGold)" filter="url(#pGlow)" />
  <circle cx="50" cy="53" r="2" fill="#ffffff" />
</svg>
